name: Build Final Contact Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify completed checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('output/progress.txt').read_text(encoding='utf-8')
          c=int(re.search(r'^completed=(\d+)$',p,re.M).group(1))
          t=int(re.search(r'^targets=(\d+)$',p,re.M).group(1))
          print(f'completed={c} targets={t}')
          if c < t:
              raise SystemExit('Checkpoint is not complete')
          PY
      - name: Build and validate final files from checkpoint only
        run: python export_outputs.py
      - name: Commit validated final files
        run: |
          git config user.name 'contact-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- output/audit.csv output/audit.xlsx output/contacts.csv output/contacts.xlsx output/review.xlsx output/summary.json final/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Build validated final contact files $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main
      - name: Upload validated final artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-final-contact-files-${{ github.run_id }}
          path: final/
          if-no-files-found: error
          retention-days: 30
