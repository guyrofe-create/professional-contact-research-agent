name: Autonomous Contact Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write

concurrency:
  group: contact-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover and refresh target universe
        run: python seed_targets.py
      - name: Run resumable research for this shift
        continue-on-error: true
        run: |
          mkdir -p output
          timeout 300m python agent.py targets.csv --out output --resume
      - name: Write heartbeat and completion state
        if: always()
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > output/last_heartbeat.txt
          python - <<'PY'
          from pathlib import Path
          import json
          targets=max(0, sum(1 for _ in open('targets.csv',encoding='utf-8-sig'))-1) if Path('targets.csv').exists() else 0
          done=sum(1 for _ in open('output/checkpoint.jsonl',encoding='utf-8')) if Path('output/checkpoint.jsonl').exists() else 0
          Path('output/progress.txt').write_text(f'completed={done}\ntargets={targets}\n',encoding='utf-8')
          complete=targets>0 and done>=targets
          Path('output/COMPLETE.txt').write_text(('COMPLETE' if complete else 'IN_PROGRESS')+f'\ncompleted={done}\ntargets={targets}\n',encoding='utf-8')
          print(f'completed={done} targets={targets} complete={complete}')
          PY
      - name: Create final repository copy when complete
        if: always()
        run: |
          mkdir -p final
          if grep -q '^COMPLETE$' output/COMPLETE.txt 2>/dev/null; then
            cp output/contacts.xlsx final/contacts_FINAL.xlsx
            cp output/audit.xlsx final/audit_FINAL.xlsx
            cp output/summary.json final/summary_FINAL.json
            cp output/COMPLETE.txt final/COMPLETE.txt
          fi
      - name: Commit targets, checkpoint and final results
        if: always()
        run: |
          git config user.name 'contact-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add targets.csv output final || true
          if ! git diff --cached --quiet; then
            git commit -m "Research checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
      - name: Upload progress artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-research-${{ github.run_id }}
          path: |
            output/audit.xlsx
            output/contacts.xlsx
            output/summary.json
            output/checkpoint.jsonl
            output/last_heartbeat.txt
            output/progress.txt
            output/COMPLETE.txt
            final/
            targets.csv
          if-no-files-found: warn
          retention-days: 30
