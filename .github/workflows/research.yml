name: Autonomous Contact Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write

concurrency:
  group: contact-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run resumable research
        run: |
          mkdir -p output
          if [ ! -f targets.csv ]; then
            echo 'targets.csv is missing. Add the complete target list first.'
            exit 2
          fi
          python agent.py targets.csv --out output --resume
      - name: Commit checkpoint and results
        if: always()
        run: |
          git config user.name 'contact-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output || true
          if ! git diff --cached --quiet; then
            git commit -m "Research checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      - name: Upload progress artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-research-latest
          path: |
            output/audit.xlsx
            output/contacts.xlsx
            output/summary.json
            output/checkpoint.jsonl
          if-no-files-found: warn
          retention-days: 30
