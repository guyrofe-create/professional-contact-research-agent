name: Autonomous Contact Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-now']
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write
  actions: write

concurrency:
  group: contact-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore successful-page cache
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: contact-http-v1-${{ github.run_id }}
          restore-keys: contact-http-v1-
      - run: pip install -r requirements.txt
      - name: Validate persisted checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          VERSION=12
          cp=Path('output/checkpoint.jsonl')
          progress=Path('output/progress.txt')
          expected=0
          expected_touched=0
          if progress.exists():
              text=progress.read_text(encoding='utf-8', errors='ignore')
              m=re.search(r'^completed=(\d+)$', text, re.M)
              t=re.search(r'^touched=(\d+)$', text, re.M)
              v=re.search(r'^algo_version=(\d+)$', text, re.M)
              if m and v and int(v.group(1))==VERSION: expected=int(m.group(1))
              if t: expected_touched=int(t.group(1))
          latest={}
          latest_any_version={}
          if cp.exists():
              for line in cp.read_text(encoding='utf-8', errors='ignore').splitlines():
                  try:
                      row=json.loads(line)
                      latest_any_version[(row.get('name',''), row.get('category',''))]=row
                      if row.get('algo_version')==VERSION:
                          latest[(row.get('name',''), row.get('category',''))]=row
                  except Exception:
                      pass
          keys={key for key,row in latest.items() if not str(row.get('status','')).startswith('PENDING')}
          actual=len(keys)
          print(f'checkpoint version={VERSION} completed={actual} expected_at_least={expected}')
          if expected and actual < expected:
              raise SystemExit(f'Safety stop: checkpoint regression {actual} < persisted progress {expected}')
          if expected_touched and len(latest_any_version) < expected_touched:
              raise SystemExit(f'Safety stop: checkpoint target loss {len(latest_any_version)} < {expected_touched}')
          PY
      - name: Validate identity and email rules
        run: python -m unittest -v test_agent.py
      - name: Discover and retain target universe
        run: python seed_targets.py
      - name: Run resumable verified research shift
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_CALL_LIMIT: 12000
          SEARCH_CIRCUIT_FAILURES: 20
          SEARCH_BACKENDS: bing,brave
          RESEARCH_WORKERS: 6
          MAX_TARGETS_PER_RUN: 10000
          PERSIST_EVERY_TARGETS: 50
          PERSIST_EVERY_SECONDS: 900
          PERSIST_CHECKPOINT_CMD: python persist_progress.py
          FETCH_CACHE_DB: .cache/http/pages.sqlite3
          FETCH_CACHE_TTL: 604800
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          mkdir -p output
          timeout 330m python agent.py targets.csv --out output --resume || test $? -eq 124
      - name: Write completion state
        if: always()
        run: |
          mkdir -p output
          date -u +%Y-%m-%dT%H:%M:%SZ > output/last_heartbeat.txt
          git fetch origin main
          remote_checkpoint=$(mktemp)
          if git show origin/main:output/checkpoint.jsonl > "$remote_checkpoint"; then
            python merge_checkpoints.py output/checkpoint.jsonl "$remote_checkpoint" --output output/checkpoint.jsonl
          fi
          python finalize_state.py
      - name: Generate and validate checkpoint reports
        if: always()
        run: python finalize_state.py
      - name: Commit checkpoint and QA outputs safely
        if: always()
        run: |
          git config user.name 'contact-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- targets.csv seed_summary.json output final
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Research checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase -X ours origin/main; then
              git rebase --abort
              exit 1
            fi
            remote_checkpoint=$(mktemp)
            if git show origin/main:output/checkpoint.jsonl > "$remote_checkpoint"; then
              python merge_checkpoints.py output/checkpoint.jsonl "$remote_checkpoint" --output output/checkpoint.jsonl
              python finalize_state.py
              git add -- targets.csv seed_summary.json output final
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$pushed" = true
      - name: Upload progress artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-research-${{ github.run_id }}
          path: |
            output/
            seed_summary.json
            final/
            targets.csv
          if-no-files-found: warn
          retention-days: 30
