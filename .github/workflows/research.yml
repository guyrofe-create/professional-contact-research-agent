name: Autonomous Contact Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write
  actions: write

concurrency:
  group: contact-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate persisted checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          VERSION=7
          cp=Path('output/checkpoint.jsonl')
          progress=Path('output/progress.txt')
          expected=0
          if progress.exists():
              text=progress.read_text(encoding='utf-8', errors='ignore')
              m=re.search(r'^completed=(\d+)$', text, re.M)
              v=re.search(r'^algo_version=(\d+)$', text, re.M)
              if m and v and int(v.group(1))==VERSION: expected=int(m.group(1))
          latest={}
          if cp.exists():
              for line in cp.read_text(encoding='utf-8', errors='ignore').splitlines():
                  try:
                      row=json.loads(line)
                      if row.get('algo_version')==VERSION:
                          latest[(row.get('name',''), row.get('category',''))]=row
                  except Exception:
                      pass
          keys={key for key,row in latest.items() if not str(row.get('status','')).startswith('PENDING')}
          actual=len(keys)
          print(f'checkpoint version={VERSION} completed={actual} expected_at_least={expected}')
          if expected and actual < expected:
              raise SystemExit(f'Safety stop: checkpoint regression {actual} < persisted progress {expected}')
          PY
      - name: Validate identity and email rules
        run: python -m unittest -v test_agent.py
      - name: Discover and retain target universe
        run: python seed_targets.py
      - name: Run resumable verified research shift
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_CALL_LIMIT: 250
          SEARCH_CIRCUIT_FAILURES: 4
          MAX_TARGETS_PER_RUN: 1500
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          mkdir -p output
          timeout 165m python agent.py targets.csv --out output --resume || test $? -eq 124
      - name: Write completion state
        if: always()
        run: |
          mkdir -p output
          date -u +%Y-%m-%dT%H:%M:%SZ > output/last_heartbeat.txt
          python - <<'PY'
          from pathlib import Path
          import csv,json
          VERSION=7
          with open('targets.csv',encoding='utf-8-sig') as f:
              targets=sum(1 for _ in csv.DictReader(f))
          latest={}; cp=Path('output/checkpoint.jsonl')
          if cp.exists():
              for line in cp.read_text(encoding='utf-8',errors='ignore').splitlines():
                  try:
                      row=json.loads(line)
                      if row.get('algo_version')==VERSION:
                          latest[(row.get('name',''),row.get('category',''))]=row
                  except Exception: pass
          touched=set(latest); pending={key for key,row in latest.items() if str(row.get('status','')).startswith('PENDING')}
          keys=touched-pending; done=len(keys); complete=targets>0 and done>=targets
          state=f'completed={done}\ntouched={len(touched)}\npending={len(pending)}\ntargets={targets}\nalgo_version={VERSION}\n'
          Path('output/progress.txt').write_text(state,encoding='utf-8')
          Path('output/COMPLETE.txt').write_text(('COMPLETE' if complete else 'IN_PROGRESS')+'\n'+state,encoding='utf-8')
          print(f'completed={done} touched={len(touched)} pending={len(pending)} targets={targets} complete={complete}')
          PY
      - name: Generate and validate checkpoint reports
        if: always()
        run: python export_outputs.py
      - name: Commit checkpoint and QA outputs safely
        if: always()
        run: |
          git config user.name 'contact-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- targets.csv seed_summary.json output final
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Research checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$pushed" = true
      - name: Upload progress artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-research-${{ github.run_id }}
          path: |
            output/
            seed_summary.json
            final/
            targets.csv
          if-no-files-found: warn
          retention-days: 30
