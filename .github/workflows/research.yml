name: Autonomous Contact Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'hospital_pass.py'
      - 'seed_targets.py'
      - 'sitecustomize.py'
      - 'test_agent.py'
      - 'requirements.txt'
      - '.github/workflows/research.yml'
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write

concurrency:
  group: contact-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate persisted checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          VERSION=4
          cp=Path('output/checkpoint.jsonl')
          progress=Path('output/progress.txt')
          expected=0
          if progress.exists():
              m=re.search(r'^completed=(\d+)$', progress.read_text(encoding='utf-8', errors='ignore'), re.M)
              if m: expected=int(m.group(1))
          keys=set()
          if cp.exists():
              for line in cp.read_text(encoding='utf-8', errors='ignore').splitlines():
                  try:
                      row=json.loads(line)
                      if row.get('algo_version')==VERSION:
                          keys.add((row.get('name',''), row.get('category','')))
                  except Exception:
                      pass
          actual=len(keys)
          print(f'checkpoint version={VERSION} completed={actual} expected_at_least={expected}')
          if expected and actual < expected:
              raise SystemExit(f'Safety stop: checkpoint regression {actual} < persisted progress {expected}')
          PY
      - name: Validate identity and email rules
        run: python -m unittest -v test_agent.py
      - name: Discover and retain target universe
        run: python seed_targets.py
      - name: Recheck unresolved clinicians on official hospital sites
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          timeout 45m python hospital_pass.py || test $? -eq 124
      - name: Run resumable verified research shift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          timeout 250m python agent.py targets.csv --out output --resume || test $? -eq 124
      - name: Write completion state
        if: always()
        run: |
          mkdir -p output
          date -u +%Y-%m-%dT%H:%M:%SZ > output/last_heartbeat.txt
          python - <<'PY'
          from pathlib import Path
          import csv,json
          VERSION=4
          with open('targets.csv',encoding='utf-8-sig') as f:
              targets=sum(1 for _ in csv.DictReader(f))
          keys=set(); cp=Path('output/checkpoint.jsonl')
          if cp.exists():
              for line in cp.read_text(encoding='utf-8',errors='ignore').splitlines():
                  try:
                      row=json.loads(line)
                      if row.get('algo_version')==VERSION: keys.add((row.get('name',''),row.get('category','')))
                  except Exception: pass
          done=len(keys); complete=targets>0 and done>=targets
          Path('output/progress.txt').write_text(f'completed={done}\ntargets={targets}\nalgo_version={VERSION}\n',encoding='utf-8')
          Path('output/COMPLETE.txt').write_text(('COMPLETE' if complete else 'IN_PROGRESS')+f'\ncompleted={done}\ntargets={targets}\nalgo_version={VERSION}\n',encoding='utf-8')
          print(f'completed={done} targets={targets} complete={complete}')
          PY
      - name: Create final copy only after full verified pass
        if: always()
        run: |
          mkdir -p final
          if grep -q '^COMPLETE$' output/COMPLETE.txt 2>/dev/null && grep -q '^algo_version=4$' output/COMPLETE.txt 2>/dev/null; then
            cp output/contacts.xlsx final/contacts_FINAL.xlsx
            cp output/audit.xlsx final/audit_FINAL.xlsx
            cp output/review.xlsx final/review_FINAL.xlsx
            cp output/summary.json final/summary_FINAL.json
            cp output/COMPLETE.txt final/COMPLETE.txt
            cp seed_summary.json final/seed_summary_FINAL.json
          else
            rm -f final/*_FINAL.*
          fi
      - name: Commit checkpoint and QA outputs safely
        if: always()
        run: |
          git config user.name 'contact-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- targets.csv seed_summary.json output final
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Research checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$pushed" = true
      - name: Upload progress artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-research-${{ github.run_id }}
          path: |
            output/
            seed_summary.json
            final/
            targets.csv
          if-no-files-found: warn
          retention-days: 30
