name: Autonomous Contact Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write

concurrency:
  group: contact-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESULT_EMAIL: ${{ secrets.RESULT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover and refresh target universe
        run: python seed_targets.py
      - name: Run resumable research
        run: |
          mkdir -p output
          python agent.py targets.csv --out output --resume
      - name: Write heartbeat
        if: always()
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > output/last_heartbeat.txt
          wc -l output/checkpoint.jsonl 2>/dev/null > output/progress.txt || true
          wc -l targets.csv >> output/progress.txt || true
      - name: Commit targets, checkpoint and results
        if: always()
        run: |
          git config user.name 'contact-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add targets.csv output || true
          if ! git diff --cached --quiet; then
            git commit -m "Research checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
      - name: Upload progress artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-research-${{ github.run_id }}
          path: |
            output/audit.xlsx
            output/contacts.xlsx
            output/summary.json
            output/checkpoint.jsonl
            output/last_heartbeat.txt
            output/progress.txt
            targets.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Email final tables when run completes
        if: success()
        run: python send_results.py
